<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acronym Dictionary</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Sakura CSS for styling -->
  
  
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/work.css') }}?v=2">
</head>
<body class="work-page work-acronyms">
  <div class="container">
    {% include 'work/_back_button.html' %}
    <h1>Acronym Dictionary</h1>
    <input class="search-box" type="text" id="search" placeholder="Type to filter acronyms..." autofocus>

    <!-- Add Acronym Form -->
    <div class="acronym-form">
      <fieldset>
        <legend>Add Acronym</legend>
        <div class="acronym-fields">
          <input type="text" id="newAcronym" placeholder="Acronym">
          <input type="text" id="newMeaning" placeholder="Meaning">
          <input type="text" id="newDescription" placeholder="Description (optional)">
          <button type="button" id="addBtn">Add</button>
        </div>
        <div id="addStatus"></div>
      </fieldset>
    </div>

    <div class="table-wrapper">
      <table id="acronym-table">
        <thead>
          <tr>
            <th style="width:20%;">Acronym</th>
            <th style="width:35%;">Meaning</th>
            <th style="width:45%;">Description</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Data rows go here -->
        </tbody>
      </table>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script>
    let data = [];  // will hold all rows from CSV

    async function loadCSVAndRenderTable() {
      const response = await fetch('/acronyms/data');
      const csvText = await response.text();
      data = Papa.parse(csvText, {header: true, skipEmptyLines: true}).data;

      const tbody = document.getElementById('table-body');

      function getCell(val) {
        return (typeof val === 'string') ? val.trim() : (val ?? '');
      }

      function renderRows(rows) {
        tbody.innerHTML = '';
        for (const row of rows) {
          const acronym = getCell(row.Acronym);
          const meaning = getCell(row.Meaning);
          const desc = getCell(row.Description);
          if (acronym.length && meaning.length) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${acronym}</td><td>${meaning}</td><td>${desc}</td>`;
            tbody.appendChild(tr);
          }
        }
      }

      window._acronymsRenderRows = renderRows;
      window._acronymsGetCell = getCell;

      renderRows(data);

      // Filter only by Acronym
      const search = document.getElementById('search');
      search.addEventListener('input', function() {
        const value = this.value.trim().toLowerCase();
        const filtered = data.filter(row => {
          const acronym = getCell(row.Acronym).toLowerCase();
          const meaning = getCell(row.Meaning);
          return acronym.length && meaning.length && acronym.includes(value);
        });
        renderRows(filtered);
      });
    }

    async function addAcronym() {
      const acronymInput = document.getElementById('newAcronym');
      const meaningInput = document.getElementById('newMeaning');
      const descInput = document.getElementById('newDescription');
      const statusEl = document.getElementById('addStatus');

      const acronym = acronymInput.value.trim();
      const meaning = meaningInput.value.trim();
      const description = descInput.value.trim();

      if (!acronym || !meaning) {
        statusEl.textContent = "Acronym and Meaning are required.";
        statusEl.style.color = "var(--red)";
        return;
      }

      statusEl.textContent = "Saving...";
      statusEl.style.color = "var(--muted)";

      try {
        const resp = await fetch('/acronyms/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ acronym, meaning, description })
        });

        const resJson = await resp.json();
        if (!resp.ok || resJson.status !== "success") {
          throw new Error(resJson.message || "Failed to save.");
        }

        data.push({
          Acronym: acronym,
          Meaning: meaning,
          Description: description
        });

        const search = document.getElementById('search');
        const value = search.value.trim().toLowerCase();
        const getCell = window._acronymsGetCell;
        const renderRows = window._acronymsRenderRows;
        const filtered = value
          ? data.filter(row => {
              const a = getCell(row.Acronym).toLowerCase();
              const m = getCell(row.Meaning);
              return a.length && m.length && a.includes(value);
            })
          : data;

        renderRows(filtered);

        acronymInput.value = "";
        meaningInput.value = "";
        descInput.value = "";

        statusEl.textContent = "Added.";
        statusEl.style.color = "var(--green)";
      } catch (e) {
        statusEl.textContent = "Error: " + e.message;
        statusEl.style.color = "var(--red)";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCSVAndRenderTable();
      const addBtn = document.getElementById('addBtn');
      if (addBtn) {
        addBtn.addEventListener('click', addAcronym);
      }
    });
  </script>
</body>
</html>
