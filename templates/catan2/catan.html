<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cities &amp; Knights Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/catan_styles.css') }}">
</head>
<body class="catan-board-page" data-board-editable="{{ 'true' if board_editable else 'false' }}">
    <div class="container">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Cities &amp; Knights Board</h1>

        <div class="controls">
            <div class="button-group" id="tool-select">
                <button class="btn btn-tool" data-tool="swap">Swap Tiles/Numbers</button>
                <button class="btn btn-tool" data-tool="shuffle-cells">Shuffle Cells</button>
                <button class="btn btn-tool" data-tool="shuffle-numbers">Shuffle Numbers</button>
                <button class="btn btn-tool" data-tool="reset-game">Reset Game</button>
                <button class="btn btn-tool" data-tool="undo">Undo Last Action</button>
            </div>
        </div>

        <p id="boardEditStatus" class="board-edit-status" role="status"></p>
        <canvas id="catanBoard"></canvas>
        <div id="messageBox" class="message-box"></div>
    </div>
    <script>window.CATAN_PLAYER_COLORS = {{ player_colors|tojson }};</script>
    <script src="{{ url_for('static', filename='js/catan_drawing_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/catan2_game_logic.js') }}"></script>
    
</body>
</html>
