<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Remote</title>
    <style>
        :root { color-scheme: light; font-family: "Segoe UI", sans-serif; background: #f3f5f4; color: #202725; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px 14px; overflow-x: hidden; }
        main { width: min(100%, 900px); margin: 0 auto; }
        h1 { margin: 0; font-size: 1.35rem; }
        .topline, .selectors { display: flex; align-items: end; gap: 10px; }
        .topline { align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .topline { flex-wrap: wrap; }
        .topline h1 { flex: 1; }
        .tv-start-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
        .tv-start-btn svg { width: 18px; height: 18px; }
        .tv-icon-btn { width: 38px; height: 38px; padding: 0; flex: 0 0 38px; }
        .tv-ip-row { display: flex; align-items: center; gap: 8px; }
        .tv-ip-row input { flex: 1; }
        .tv-start-dialog { width: min(360px, calc(100% - 28px)); max-height: calc(100dvh - 28px); overflow-y: auto; padding: 20px; border: 1px solid #aeb9b4; border-radius: 6px; color: #202725; background: #f3f5f4; }
        .tv-start-dialog::backdrop { background: rgb(0 0 0 / 45%); }
        .tv-start-dialog h2 { margin: 0 0 16px; font-size: 1.1rem; }
        .tv-start-dialog form { display: grid; gap: 12px; }
        .tv-start-dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .tv-start-dialog output { font-size: .85rem; overflow-wrap: anywhere; white-space: pre-wrap; }
        .add-media-dialog { width: min(460px, calc(100% - 28px)); }
        .add-media-dialog textarea { width: 100%; min-height: 90px; padding: 6px 9px; border: 1px solid #aeb9b4; border-radius: 4px; background: #fff; color: inherit; font: inherit; font-size: 16px; resize: vertical; }
        .media-item.added { background: #fff6d8; box-shadow: inset 4px 0 #c49c26; }
        .database-choices { display: flex; flex-wrap: wrap; gap: 8px; }
        .database-choices:empty { display: none; }
        .selectors { flex-wrap: wrap; margin-bottom: 12px; }
        .selectors label { flex: 1 1 135px; }
        label { display: grid; flex: 1 1 150px; gap: 5px; font-size: .82rem; font-weight: 600; }
        /* iOS Safari zooms when focusing form controls below 16px. */
        select, input { width: 100%; min-width: 0; height: 38px; padding: 6px 9px; border: 1px solid #aeb9b4; border-radius: 4px; background: #fff; color: inherit; font: inherit; font-size: 16px; }
        button { min-height: 38px; padding: 6px 12px; border: 1px solid #176b5b; border-radius: 4px; background: #176b5b; color: #fff; font: 600 .85rem "Segoe UI", sans-serif; cursor: pointer; }
        button:hover:not(:disabled) { background: #125447; }
        button:disabled { opacity: .45; cursor: default; }
        .transport .ctrl-btn, .pagination .ctrl-btn { display: inline-flex; width: 40px; height: 40px; min-height: 40px; align-items: center; justify-content: center; padding: 0; border: 1px solid #383838; border-radius: 10px; background: #272727; color: #f1f1f1; font-size: 1.35rem; line-height: 1; transition: background .15s, transform .1s; -webkit-tap-highlight-color: transparent; }
        .transport .ctrl-btn:hover:not(:disabled), .pagination .ctrl-btn:hover:not(:disabled) { background: #383838; color: #00e676; }
        .transport .ctrl-btn:active:not(:disabled), .pagination .ctrl-btn:active:not(:disabled) { transform: scale(.95); }
        .transport .play-main-btn { width: 40px; height: 40px; min-height: 40px; margin: 0; border: 0; border-radius: 50%; background: #00c853; color: #0f0f0f; font-size: 1.35rem; box-shadow: 0 2px 10px rgba(0, 200, 83, .4); }
        .transport .play-main-btn:hover:not(:disabled) { background: #00e676; color: #000; }
        .current { min-height: 44px; margin: 0 0 12px; padding: 10px 12px; background: #e7ece9; border-radius: 4px; font-size: .9rem; }
        .tag-filters { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 28px; margin: 0 0 12px; }
        .tag-label, .tag-empty { color: #64716b; font-size: .82rem; }
        .tag-chip { min-height: 28px; padding: 3px 9px; border: 1px solid #bdc9c4; border-radius: 14px; background: #fff; color: #34443d; font-size: .78rem; }
        .tag-chip.selected { border-color: #176b5b; background: #176b5b; color: #fff; }
        .transport { display: grid; gap: 8px; margin-bottom: 14px; }
        .transport-buttons { display: grid; width: 100%; max-width: 500px; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; margin: 0 auto; }
        .transport-buttons .ctrl-btn { width: 100%; }
        .transport-options { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .transport .volume-control { display: flex; flex: 0 1 220px; align-items: center; gap: 8px; min-width: 0; }
        .transport-options input[type="range"] { flex: 1; width: auto; height: 20px; min-width: 0; padding: 0; accent-color: #176b5b; }
        .transport-seek { display: flex; align-items: center; gap: 10px; }
        .transport-seek input[type="range"] { flex: 1; width: 100%; height: 20px; min-width: 0; padding: 0; accent-color: #176b5b; }
        .transport .transport-time { min-width: 88px; color: #52615a; font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .library { display: grid; gap: 6px; }
        .media-item { display: grid; width: 100%; grid-template-columns: minmax(0, 1fr); align-items: center; min-height: 54px; padding: 9px 10px; border: 0; border-bottom: 1px solid #d5ddda; border-radius: 0; background: #fff; color: inherit; font: inherit; text-align: left; cursor: pointer; }
        .media-item:hover, .media-item:focus-visible { background: #eff5f1; outline: 2px solid #176b5b; outline-offset: -2px; }
        .media-item.playing { background: #dceee2; box-shadow: inset 4px 0 #176b5b; }
        .media-title { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
        .media-subtitle { margin-top: 3px; color: #5e6b65; font-size: .78rem; }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 0; }
        .pagination span { min-width: 68px; color: #52615a; font-size: .82rem; text-align: center; font-variant-numeric: tabular-nums; }
        .empty { color: #68746e; padding: 18px 4px; }
        [role="status"] { min-height: 1.2em; color: #52615a; font-size: .85rem; }
        @media (max-width: 520px) {
            body { padding: 14px 10px; }
            .topline { align-items: flex-start; gap: 8px; }
            #connectionStatus { text-align: right; }
            .selectors { gap: 8px; }
            .selectors label { flex-basis: 135px; }
            .transport-buttons { gap: 3px; }
            .transport-options { gap: 8px; }
            .transport .volume-control { flex-basis: min(220px, calc(100vw - 100px)); }
            .transport-seek { gap: 8px; }
            .transport .transport-time {
                min-width: 0;
                text-align: right;
            }
            .tag-chip { min-height: 36px; }
            .pagination { gap: 8px; }
            .pagination .ctrl-btn { width: 44px; height: 44px; min-height: 44px; flex: 0 0 44px; }
        }
    </style>
</head>
<body>
    <main id="remoteApp" data-mode="remote" data-unlocked='{{ unlocked | tojson }}'>
        <header class="topline">
            <h1>Media Remote</h1>
            <button type="button" id="tvIpBtn" class="tv-start-btn tv-icon-btn" title="Set TV IP" aria-label="Set TV IP" aria-haspopup="dialog">
                <i data-lucide="network" aria-hidden="true">&#9881;</i>
            </button>
            <button type="button" id="startTvBtn" class="tv-start-btn tv-icon-btn" title="Wake TV and launch FunHub" aria-label="Wake TV and launch FunHub">
                <i data-lucide="power" aria-hidden="true">&#9211;</i>
            </button>
            <span id="connectionStatus" role="status">Connecting…</span>
        </header>
        <section class="selectors" aria-label="Media selection">
            <label for="databaseButton">Database
                <button type="button" id="databaseButton" class="tv-start-btn" title="Change database" aria-haspopup="dialog">
                    <i data-lucide="database" aria-hidden="true"></i><span>YouTube</span>
                </button>
            </label>
            <button type="button" id="addMediaBtn" class="tv-start-btn tv-icon-btn" title="Add media" aria-label="Add media" aria-haspopup="dialog">
                <i data-lucide="plus" aria-hidden="true">+</i>
            </button>
            <label for="playlistSelect">Playlist
                <select id="playlistSelect"></select>
            </label>
            <label for="categorySelect">Category
                <select id="categorySelect"></select>
            </label>
            <label for="mediaSearch">Search
                <input id="mediaSearch" type="search" autocomplete="off" placeholder="Title or artist">
            </label>
        </section>
        <section id="tagFilters" class="tag-filters" aria-label="Filter by tags"></section>
        <p class="current" id="currentMedia">Nothing playing</p>
        <section class="transport" aria-label="Playback controls">
            <div class="transport-buttons" aria-label="Playback buttons">
                <button class="ctrl-btn" type="button" id="previousTrack" title="Previous video" aria-label="Previous video">&#9198;</button>
                <button class="ctrl-btn" type="button" id="previousChapter" title="Previous chapter" aria-label="Previous chapter">&#8676;</button>
                <button class="ctrl-btn" type="button" id="seekBackMinute" title="Back 1 minute" aria-label="Back 1 minute">&#9194;</button>
                <button class="ctrl-btn" type="button" id="seekBack" title="Back 10 seconds" aria-label="Back 10 seconds">&#8634;</button>
                <button class="ctrl-btn play-main-btn" type="button" id="togglePlayback" title="Play" aria-label="Play" disabled>
                    <span class="icon-play">&#9658;</span>
                    <span class="icon-pause" hidden>&#10074;&#10074;</span>
                </button>
                <button class="ctrl-btn" type="button" id="seekForward" title="Forward 10 seconds" aria-label="Forward 10 seconds">&#8635;</button>
                <button class="ctrl-btn" type="button" id="seekForwardMinute" title="Forward 1 minute" aria-label="Forward 1 minute">&#9193;</button>
                <button class="ctrl-btn" type="button" id="nextChapter" title="Next chapter" aria-label="Next chapter">&#8677;</button>
                <button class="ctrl-btn" type="button" id="nextTrack" title="Next video" aria-label="Next video">&#9197;</button>
            </div>
            <div class="transport-options">
                <label class="volume-control" for="volumeSlider"><span>Volume</span>
                    <input id="volumeSlider" type="range" min="0" max="100" value="100" aria-label="Volume" disabled>
                </label>
                <button class="ctrl-btn" type="button" id="audioOnlyToggle" title="Audio only" aria-label="Audio only" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-1a7 7 0 0 1 14 0v1h-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg>
                </button>
            </div>
            <div class="transport-seek">
                <input id="seekSlider" type="range" min="0" max="100" value="0" aria-label="Seek position" disabled>
                <span id="timeDisplay" class="transport-time">0:00</span>
            </div>
        </section>
        <section id="mediaList" class="library" aria-label="Media library" aria-live="polite"></section>
        <nav class="pagination" aria-label="Media pages">
            <button class="ctrl-btn" type="button" id="previousPage" title="Previous page" aria-label="Previous page">&#x276E;</button>
            <span id="pageIndicator">Page 1 of 1</span>
            <button class="ctrl-btn" type="button" id="nextPage" title="Next page" aria-label="Next page">&#x276F;</button>
        </nav>
        <p id="remoteMessage" role="status"></p>
    </main>
    <dialog id="tvIpDialog" class="tv-start-dialog" aria-labelledby="tvIpTitle">
        <h2 id="tvIpTitle">TV IP</h2>
        <form id="tvIpForm">
            <label for="tvIpControlKey">TV control key
                <input id="tvIpControlKey" type="password" autocomplete="off" required>
            </label>
            <label for="tvIpInput">IP address</label>
            <div class="tv-ip-row">
                <input id="tvIpInput" type="text" autocomplete="off" spellcheck="false" required>
                <button type="button" id="tvIpLoad" class="tv-start-btn tv-icon-btn" title="Read current TV IP" aria-label="Read current TV IP"><i data-lucide="refresh-cw" aria-hidden="true">&#8635;</i></button>
            </div>
            <output id="tvIpStatus" role="status"></output>
            <div class="dialog-actions">
                <button type="button" id="tvIpCancel">Cancel</button>
                <button type="submit" id="tvIpSave" class="tv-start-btn"><i data-lucide="save" aria-hidden="true"></i><span>Save</span></button>
            </div>
        </form>
    </dialog>
    <dialog id="addMediaDialog" class="tv-start-dialog add-media-dialog" aria-labelledby="addMediaTitle">
        <h2 id="addMediaTitle">Add Media</h2>
        <form id="addMediaForm">
            <label for="addMediaUrls"><span id="addMediaUrlLabel">YouTube links or IDs, one per line</span>
                <textarea id="addMediaUrls" rows="4" required></textarea>
            </label>
            <label for="addMediaTitleInput" id="addMediaTitleLabel">Title (single entry only)
                <input id="addMediaTitleInput" type="text" autocomplete="off">
            </label>
            <label for="addMediaPlaylist">Playlist
                <input id="addMediaPlaylist" type="text" list="addMediaPlaylists" autocomplete="off" required>
            </label>
            <label for="addMediaCategory">Category
                <input id="addMediaCategory" type="text" list="addMediaCategories" autocomplete="off">
            </label>
            <label for="addMediaTags">Tags
                <input id="addMediaTags" type="text" placeholder="Comma-separated" autocomplete="off">
            </label>
            <datalist id="addMediaPlaylists"></datalist>
            <datalist id="addMediaCategories"></datalist>
            <output id="addMediaStatus" role="status"></output>
            <div class="dialog-actions">
                <button type="button" id="addMediaCancel">Cancel</button>
                <button type="submit" id="addMediaSubmit">Save</button>
            </div>
        </form>
    </dialog>
    <dialog id="xPinDialog" class="tv-start-dialog" aria-labelledby="xPinTitle">
        <h2 id="xPinTitle">Select Database</h2>
        <form id="xPinForm">
            <div id="unlockedDatabases" class="database-choices" role="group" aria-label="Unlocked databases"></div>
            <label for="remoteXPin">PIN
                <input id="remoteXPin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </label>
            <output id="xPinStatus" role="status"></output>
            <div class="dialog-actions">
                <button type="button" id="xPinCancel">Cancel</button>
                <button type="submit" id="xPinSubmit">Select</button>
            </div>
        </form>
    </dialog>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="{{ url_for('static', filename='js/mm_common.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/mm_tvremote.js') }}?v=16"></script>
</body>
</html>
