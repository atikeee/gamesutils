<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2330;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --soft:     #3d444d;

      /* category accents */
      --c-cards:   #f78166;
      --c-board:   #58a6ff;
      --c-quiz:    #d2a8ff;
      --c-tutoring:#e3b341;
      --c-media:   #ffa657;
      --c-tools:   #3fb950;
      --c-flights: #79c0ff;

      --g-cards:   rgba(247,129,102,0.12);
      --g-board:   rgba(88,166,255,0.12);
      --g-quiz:    rgba(210,168,255,0.12);
      --g-tutoring:rgba(227,179,65,0.12);
      --g-media:   rgba(255,166,87,0.12);
      --g-tools:   rgba(63,185,80,0.12);
      --g-flights: rgba(121,192,255,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(88,166,255,0.07) 0%, transparent 70%),
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
    }

    /* ─── HEADER ─── */
    header {
      padding: 48px 24px 36px;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .logo-icon {
      font-size: 36px;
      filter: drop-shadow(0 0 16px rgba(88,166,255,0.5));
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(130deg, #e6edf3 40%, #58a6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    /* ─── MAIN ─── */
    main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 18px;
    }

    /* ─── SECTION ─── */
    .section { margin-bottom: 40px; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .section-bar {
      width: 3px;
      height: 18px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .cat-cards   .section-bar { background: var(--c-cards); }
    .cat-board   .section-bar { background: var(--c-board); }
    .cat-quiz    .section-bar { background: var(--c-quiz); }
    .cat-tutoring .section-bar { background: var(--c-tutoring); }
    .cat-media   .section-bar { background: var(--c-media); }
    .cat-tools   .section-bar { background: var(--c-tools); }
    .cat-flights .section-bar { background: var(--c-flights); }

    /* ─── TILE GRID ─── */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    /* ─── TILE ─── */
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 22px 10px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      text-align: center;
      cursor: pointer;
      /* entrance animation */
      opacity: 0;
      transform: translateY(10px);
      animation: tileIn 0.4s ease forwards;
      transition:
        transform       0.22s cubic-bezier(.34,1.4,.64,1),
        box-shadow      0.22s ease,
        border-color    0.22s ease,
        background      0.22s ease;
      /* clip tooltip overflow within grid cells */
      overflow: visible;
    }

    /* hover glow per category */
    .cat-cards   .tile:hover { border-color: var(--c-cards);   box-shadow: 0 0 0 1px var(--c-cards),   0 10px 36px var(--g-cards);   background: var(--surface2); }
    .cat-board   .tile:hover { border-color: var(--c-board);   box-shadow: 0 0 0 1px var(--c-board),   0 10px 36px var(--g-board);   background: var(--surface2); }
    .cat-quiz    .tile:hover { border-color: var(--c-quiz);    box-shadow: 0 0 0 1px var(--c-quiz),    0 10px 36px var(--g-quiz);    background: var(--surface2); }
    .cat-tutoring .tile:hover { border-color: var(--c-tutoring); box-shadow: 0 0 0 1px var(--c-tutoring), 0 10px 36px var(--g-tutoring); background: var(--surface2); }
    .cat-media   .tile:hover { border-color: var(--c-media);   box-shadow: 0 0 0 1px var(--c-media),   0 10px 36px var(--g-media);   background: var(--surface2); }
    .cat-tools   .tile:hover { border-color: var(--c-tools);   box-shadow: 0 0 0 1px var(--c-tools),   0 10px 36px var(--g-tools);   background: var(--surface2); }
    .cat-flights .tile:hover { border-color: var(--c-flights); box-shadow: 0 0 0 1px var(--c-flights), 0 10px 36px var(--g-flights); background: var(--surface2); }

    .tile:hover { transform: translateY(-5px) scale(1.03); }
    .tile:active { transform: translateY(-2px) scale(1.01); }

    /* icon */
    .tile-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-size: 28px;
      line-height: 1.2;
      transition: transform 0.22s cubic-bezier(.34,1.6,.64,1);
    }
    .tile:hover .tile-icon { transform: scale(1.18) rotate(-4deg); }

    /* name */
    .tile-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      letter-spacing: 0.1px;
    }

    /* category dot on tile */
    .tile::before {
      content: '';
      position: absolute;
      top: 10px; right: 10px;
      width: 5px; height: 5px;
      border-radius: 50%;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .tile:hover::before { opacity: 1; }
    .cat-cards   .tile::before { background: var(--c-cards); }
    .cat-board   .tile::before { background: var(--c-board); }
    .cat-quiz    .tile::before { background: var(--c-quiz); }
    .cat-tutoring .tile::before { background: var(--c-tutoring); }
    .cat-media   .tile::before { background: var(--c-media); }
    .cat-tools   .tile::before { background: var(--c-tools); }
    .cat-flights .tile::before { background: var(--c-flights); }

    /* ─── TOOLTIP ─── */
    .tip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: #21262d;
      border: 1px solid #444c56;
      border-radius: 10px;
      padding: 9px 13px;
      width: 210px;
      max-width: 88vw;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--muted);
      text-align: left;
      pointer-events: none;
      opacity: 0;
      z-index: 999;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      transition: opacity 0.18s ease, transform 0.18s ease;
      white-space: normal;
    }
    /* arrow down */
    .tip::after {
      content: '';
      position: absolute;
      top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: #444c56;
    }
    .tip::before {
      content: '';
      position: absolute;
      top: calc(100% + 1px); left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #21262d;
      z-index: 1;
    }

    .tile:hover .tip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* flip tooltip downward when near top of viewport */
    .tile.tip-below .tip {
      bottom: auto;
      top: calc(100% + 12px);
      transform: translateX(-50%) translateY(-6px);
    }
    .tile.tip-below .tip::after {
      top: auto; bottom: 100%;
      border-top-color: transparent;
      border-bottom-color: #444c56;
    }
    .tile.tip-below .tip::before {
      top: auto; bottom: calc(100% + 1px);
      border-top-color: transparent;
      border-bottom-color: #21262d;
    }
    .tile.tip-below:hover .tip { transform: translateX(-50%) translateY(0); }

    /* ─── ENTRANCE ANIMATION ─── */
    @keyframes tileIn {
      to { opacity: 1; transform: translateY(0); }
    }
    /* Stagger tiles inside each grid */
    .tile:nth-child(1)  { animation-delay: 0.03s }
    .tile:nth-child(2)  { animation-delay: 0.07s }
    .tile:nth-child(3)  { animation-delay: 0.11s }
    .tile:nth-child(4)  { animation-delay: 0.15s }
    .tile:nth-child(5)  { animation-delay: 0.19s }
    .tile:nth-child(6)  { animation-delay: 0.23s }
    .tile:nth-child(7)  { animation-delay: 0.27s }
    .tile:nth-child(8)  { animation-delay: 0.31s }
    .tile:nth-child(9)  { animation-delay: 0.35s }

    /* ─── FOOTER ─── */
    footer {
      text-align: center;
      margin-top: 60px;
      color: var(--soft);
      font-size: 12px;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 540px) {
      header { padding: 32px 16px 24px; }
      main { padding: 0 12px; }
      .tile-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
      .tile { padding: 16px 8px 14px; gap: 7px; border-radius: 12px; }
      .tile-icon { font-size: 24px; }
      .tile-name { font-size: 11.5px; }
      /* always show tooltip below on mobile to avoid off-screen */
      .tip {
        bottom: auto !important;
        top: calc(100% + 10px) !important;
        transform: translateX(-50%) translateY(-6px) !important;
      }
      .tip::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: #444c56; }
      .tip::before { top: auto; bottom: calc(100% + 1px); border-top-color: transparent; border-bottom-color: #21262d; z-index:1; }
      .tile:hover .tip { transform: translateX(-50%) translateY(0) !important; }
    }

    @media (max-width: 360px) {
      .tile-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">🎮</span>
    <h1>Game Hub</h1>
  </div>
  <p class="subtitle">Games · Puzzles · Tools — all in one place</p>
</header>

<main>
  {% for section in dashboard_sections %}
  <section class="section cat-{{ section.key }}">
    <div class="section-header">
      <div class="section-bar"></div>
      <span class="section-title">{{ section.title }}</span>
      <div class="section-line"></div>
    </div>
    <div class="tile-grid">
      {% for item in section['items'] %}
      <a href="{{ item.href }}" class="tile" style="animation-delay: {{ loop.index0 * 35 }}ms">
        <span class="tile-icon">{{ item.icon }}</span>
        <span class="tile-name">{{ item.title }}</span>
        <div class="tip">{{ item.description }}</div>
      </a>
      {% endfor %}
    </div>
  </section>
  {% endfor %}

</main>

<footer>
  <p>Game Hub &mdash; all your apps, one place</p>
</footer>

<script>
  // Flip tooltips downward when tile is near the top of the viewport
  function positionTooltips() {
    document.querySelectorAll('.tile').forEach(tile => {
      const rect = tile.getBoundingClientRect();
      tile.classList.toggle('tip-below', rect.top < 200);
    });
  }
  window.addEventListener('scroll', positionTooltips, { passive: true });
  window.addEventListener('resize', positionTooltips, { passive: true });
  positionTooltips();

  // Touch devices: tap to toggle tooltip (first tap shows, second navigates)
  if ('ontouchstart' in window) {
    let openTile = null;
    document.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('click', e => {
        if (tile !== openTile) {
          e.preventDefault();
          if (openTile) openTile.classList.remove('touch-open');
          tile.classList.add('touch-open');
          openTile = tile;
        } else {
          // second tap — let the link navigate
          openTile = null;
        }
      });
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.tile') && openTile) {
        openTile.classList.remove('touch-open');
        openTile = null;
      }
    });
  }
</script>

<!-- Touch tooltip style: show tip on first tap -->
<style>
  .tile.touch-open .tip {
    opacity: 1 !important;
    transform: translateX(-50%) translateY(0) !important;
  }
</style>

</body>
</html>
