<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catan Player {{ player_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/catan_styles.css', v='1.1') }}">
</head>
<body class="catan-player-page{% if player_color %} has-player-color{% endif %}" data-player-id="{{ player_id }}"{% if player_color %} style="--player-color: {{ player_color }}; --player-color-text: {{ '#1a1a1a' if player_color == '#F1C40F' else '#ffffff' }}"{% endif %}>
    
    <div class="container player-page-container">
        {% if not player_color %}
        <section class="player-color-picker" aria-labelledby="player-color-title">
            <h2 id="player-color-title">Choose your placement color</h2>
            {% if error %}<p class="player-color-error" role="alert">{{ error }}</p>{% endif %}
            <form method="post" class="player-color-options">
                {% for option in color_options %}
                <label class="player-color-option{% if not option.available %} unavailable{% endif %}">
                    <input type="radio" name="color" value="{{ option.value }}" {% if not option.available %}disabled{% endif %} required>
                    <span class="player-color-swatch" style="--player-color: {{ option.value }}"></span>
                    <span>{{ option.name }}<span class="player-color-status">{% if not option.available %} (taken){% endif %}</span></span>
                </label>
                {% endfor %}
                <button type="submit">Save color</button>
            </form>
        </section>
        {% endif %}

        <button type="button" id="startCatanGame" class="player-start-button" {% if game_started or not player_color %}hidden{% endif %}>Start game</button>
        <div class="player-map-shell">
        <div class="player-map-header">
            <button type="button" class="btn-tool map-undo" data-tool="undo-player" title="Undo unavailable" aria-label="Undo" disabled><i class="fas fa-undo" aria-hidden="true"></i></button>
            <div class="player-heading text-[1.85625rem] font-bold capitalize text-gray-800" id="playerNameDisplay">{{ player_name }}</div>
        </div>
        <div class="player-map-board">
        <div class="canvas-wrapper map-zoom-viewport">
            <canvas id="catanBoard"></canvas>
        </div>
        <div class="map-overlay map-top-right"><button type="button" class="map-zoom-toggle" id="mapZoomToggle" aria-pressed="false" title="Zoom in" aria-label="Zoom in">+</button></div>
        <div class="player-action-toolbar map-overlay map-bottom-left" id="player-tool-select" role="toolbar" aria-label="Game actions">
            <button type="button" class="btn-tool" data-tool="city" title="City" aria-label="City"><i class="fas fa-city" aria-hidden="true"></i></button>
            <button type="button" class="btn-tool" data-tool="house" title="Settlement" aria-label="Settlement"><i class="fas fa-home" aria-hidden="true"></i></button>
            <button type="button" class="btn-tool" data-tool="road" title="Road" aria-label="Road"><i class="fas fa-road" aria-hidden="true"></i></button>
        </div>
        <div class="map-overlay map-bottom-right"><span id="lastRollTotal" class="last-roll-total" hidden></span><button type="button" class="btn-tool" id="turnButton" data-state="waiting" title="Not your turn" aria-label="Not your turn" disabled><i class="fas fa-circle" aria-hidden="true"></i></button></div>
        </div>
        </div>

        <div id="messageBox" class="message-box"></div>

        <div class="controls player-controls">
            <div class="card-buttons mt-4">
                <div class="resource-card-group">
                    <!-- Resource Cards -->
                    <div class="resource-card" data-resource-type="wood">
                        <span class="card-text">Wood</span>
                    </div>
                    <div class="resource-card" data-resource-type="brick">
                        <span class="card-text">Brick</span>
                    </div>
                    <div class="resource-card" data-resource-type="sheep">
                        <span class="card-text">Sheep</span>
                    </div>
                    <div class="resource-card" data-resource-type="hay">
                        <span class="card-text">Hay</span>
                    </div>
                    <div class="resource-card" data-resource-type="rock">
                        <span class="card-text">Rock</span>
                    </div>
                    <!-- Development Card - Moved inside resource-card-group for single row layout -->
                    <div class="dev-card" data-resource-type="development">
                        <span class="card-text">Dev Card</span>
                    </div>
                    
                </div>
                <div id="resourceSelectionSlot">
                    <div class="resource-selection-tray" id="resourceSelectionTray" hidden aria-live="polite">
                        <div class="resource-selection-summary">
                            <span id="resourceSelectionDetails"></span>
                        </div>
                        <div class="resource-selection-actions">
                            <button type="button" class="resource-tray-confirm" id="confirmResourceSelection" disabled>Take cards</button>
                            <button type="button" class="resource-tray-clear" id="clearResourceSelection" title="Clear selection" aria-label="Clear selection"><i class="fas fa-times" aria-hidden="true"></i></button>
                        </div>
                    </div>
                </div>
                <!-- The original dev card button is removed as it's now a div within the group -->
            </div>
        </div>
        <div class="player-decks-section">
            <div class="deck-display">
                <h2 class="player-cards-heading">Hands (<span id="handCardCount">0</span> + <span id="devCardCount">0</span>) <button type="button" id="toggleDevCards" class="dev-cards-toggle" aria-controls="devCards" aria-expanded="false" aria-label="Show development cards" title="Show development cards"><i class="fas fa-eye" aria-hidden="true"></i></button> <span class="played-dev-card" title="Victory point cards played"><img src="{{ url_for('static', filename='images/catan/victory_point.jpg') }}" alt="Victory point cards played"> <span id="victoryPointCount">0</span></span> <span class="played-dev-card" title="Knight cards played"><img src="{{ url_for('static', filename='images/catan/Knight.jpg') }}" alt="Knight cards played"> <span id="knightPlayedCount">0</span></span></h2>
                <div id="handCards" class="card-list"></div>
                <span id="selectedCardCount" hidden>0</span>
                <div id="devCards" class="card-list concealed"></div>
            </div>
        </div>
        <div id="handSelectionSlot">
            <div class="resource-selection-tray hand-selection-panel" id="handSelectionPanel" hidden aria-live="polite">
                <div class="resource-selection-summary">
                    <span id="handSelectionDetails"></span>
                </div>
                <div class="resource-selection-actions">
                    <button type="button" class="resource-tray-confirm resource-tray-drop" id="dropSelectedCards" title="Drop cards" aria-label="Drop cards" disabled><i class="fas fa-trash-alt" aria-hidden="true"></i></button>
                    <button type="button" class="resource-tray-clear" id="clearHandSelection" title="Clear selection" aria-label="Clear selection"><i class="fas fa-times" aria-hidden="true"></i></button>
                    <div id="transferDropButtons" class="button-group transfer-buttons"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="player-content-spacer" aria-hidden="true"></div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmationModal" class="modal-overlay hidden">
        <div class="modal-content">
            <p id="modalMessage" class="modal-message"></p>
            <div class="modal-buttons">
                <button id="modalConfirmBtn" class="btn btn-confirm">Confirm</button>
                <button id="modalCancelBtn" class="btn btn-cancel">Cancel</button>
            </div>
        </div>
    </div>
    <div id="choiceModal" class="modal-overlay hidden"><div class="modal-content"><p id="choiceTitle"></p><div id="choiceButtons" class="modal-buttons"></div></div></div>

    <!-- Removed Socket.IO client library -->
    <!-- Load drawing utilities first, then game logic -->
    <script>
        // Pass player_id from Flask to JavaScript
        window.PLAYER_ID = {{ player_id }};
        window.PLAYER_NAME = {{ player_name|tojson }};
        window.CATAN_PLAYER_COLORS = {{ player_colors|tojson }};

    </script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/catan_drawing_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/catan_game_logic.js', v='1.1') }}"></script>
</body>
</html>
