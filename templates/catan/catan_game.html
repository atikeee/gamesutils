<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catan GamePlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/catan_styles.css') }}">
</head>
<body class="bg-gray-100 catan-game-page">
    <div class="main-container">
        <div class="left-column">
            <div class="game-title-row mb-4">
                <h1 class="text-2xl font-bold text-gray-800" id="gameTurnTitle">Catan Game play</h1>
                <button type="button" id="boardControlsToggle" class="board-controls-toggle" aria-pressed="false" aria-controls="boardTools" title="Enable map controls" aria-label="Enable map controls"><i class="fas fa-eye-slash" aria-hidden="true"></i></button>
            </div>
            <div class="game-board-shell">
                <div class="game-map" id="boardTools">
                    <div class="canvas-wrapper map-zoom-viewport">
                        <canvas id="catanBoard"></canvas>
                    </div>
                    <div class="map-corner map-corner-top-left">
                        <button type="button" class="map-tool" data-tool="shuffle-cells" title="Shuffle tiles" aria-label="Shuffle tiles" disabled><i class="fas fa-shuffle" aria-hidden="true"></i></button>
                        <button type="button" class="map-tool" data-tool="shuffle-numbers" title="Shuffle numbers" aria-label="Shuffle numbers" disabled><i class="fas fa-dice" aria-hidden="true"></i></button>
                    </div>
                    <div class="map-corner map-corner-top-right">
                        <button type="button" class="map-tool" id="mapZoomToggle" aria-pressed="false" title="Zoom in" aria-label="Zoom in" disabled><i class="fas fa-magnifying-glass-plus" aria-hidden="true"></i></button>
                    </div>
                    <div class="map-corner map-corner-bottom-left">
                        <button type="button" class="map-tool map-tool-danger" data-tool="reset-game" title="Reset game" aria-label="Reset game" disabled><i class="fas fa-power-off" aria-hidden="true"></i></button>
                    </div>
                    <div class="map-corner map-corner-bottom-right">
                        <button type="button" class="map-tool" data-tool="undo" title="Undo last board change" aria-label="Undo last board change" disabled><i class="fas fa-rotate-left" aria-hidden="true"></i></button>
                        <button type="button" class="map-tool" data-tool="swap" aria-pressed="false" title="Swap tiles or numbers" aria-label="Swap tiles or numbers" disabled><i class="fas fa-right-left" aria-hidden="true"></i></button>
                    </div>
                </div>
            </div>
            <div id="messageBox" class="message-box"></div>
            <dialog id="resetDialog" class="game-dialog" aria-labelledby="resetDialogTitle" aria-describedby="resetDialogText">
                <form method="dialog">
                    <div class="game-dialog-icon"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i></div>
                    <h2 id="resetDialogTitle">Reset game?</h2>
                    <p id="resetDialogText">All player seats and progress will be cleared. The board layout is kept.</p>
                    <div class="game-dialog-actions">
                        <button type="submit" value="cancel" class="game-dialog-cancel" autofocus>Cancel</button>
                        <button type="submit" value="confirm" class="game-dialog-confirm"><i class="fas fa-power-off" aria-hidden="true"></i> Reset game</button>
                    </div>
                </form>
            </dialog>
        </div>
        <div class="middle-column">
            <div class="middle-top-row">
            <div class="middle-section">
                <div class="played-dev-cards-section">
                    <div id="lastRollPlayer"></div>
                    <div id="diceroll">
                    <!-- Played development cards will be displayed here -->
                    </div>
                </div>
            </div>
            <div class="middle-section">
                <div class="played-dev-cards-section">
                    <div id="devCards" class="card-list"><span>No card played yet</span></div>
                </div>
            </div>
            </div>
            <div class="middle-section">
                <div class="assign-point-section mt-6">
                    <div>Development cards remaining: <strong id="devDeckCount">25</strong></div>
                    <div id="assignpoint">
                    <!-- add couple of button-->
                     <table class="w-full text-left table-auto border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 uppercase text-sm leading-normal">
                            <!-- Table Headers -->
                            <th class="py-3 px-2 text-left border-b-2 border-gray-300 rounded-tl-lg">Name</th>
                            <th class="py-3 px-2 text-left border-b-2 border-gray-300">Score</th>
                            <th class="py-3 px-2 text-left border-b-2 border-gray-300">Cards</th>
                            <th class="py-3 px-2 text-left border-b-2 border-gray-300" title="Knights played">Knights</th>
                            <th class="py-3 px-2 text-left border-b-2 border-gray-300">Dev</th>
                            <th class="py-3 px-2 text-left border-b-2 border-gray-300">VP</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600 text-sm font-light">
                        <!-- Row 1 -->
                        <tr class="border-b border-gray-200 hover:bg-gray-100" data-player-id="player1">
                            <td class="result" id="cell-0-0">Player 1</td>
                            <td class="result" id="cell-0-1">0</td>
                            <td class="result" id="cell-0-2"></td>
                            <td class="result" id="cell-0-3">0</td>
                            <td class="result" id="cell-0-4"></td>
                            <td class="result">0</td>
                        </tr>
                        <!-- Row 2 -->
                        <tr class="border-b border-gray-200 hover:bg-gray-100" data-player-id="player2">
                            <td class="result" id="cell-1-0">Player 2</td>
                            <td class="result" id="cell-1-1">0</td>
                            <td class="result" id="cell-1-2"></td>
                            <td class="result" id="cell-1-3">0</td>
                            <td class="result" id="cell-1-4"></td>
                            <td class="result">0</td>
                        </tr>
                        <!-- Row 3 -->
                        <tr class="border-b border-gray-200 hover:bg-gray-100" data-player-id="player3">
                            <td class="result" id="cell-2-0">Player 3</td>
                            <td class="result" id="cell-2-1">0</td>
                            <td class="result" id="cell-2-2"></td>
                            <td class="result" id="cell-2-3">0</td>
                            <td class="result" id="cell-2-4"></td>
                            <td class="result">0</td>
                        </tr>
                        <!-- Row 4 -->
                        <tr class="hover:bg-gray-100" data-player-id="player4">
                            <td class="result" id="cell-3-0">Player 4</td>
                            <td class="result" id="cell-3-1">0</td>
                            <td class="result" id="cell-3-2"></td>
                            <td class="result" id="cell-3-3">0</td>
                            <td class="result" id="cell-3-4"></td>
                            <td class="result">0</td>
                        </tr>
                    </tbody>
                </table>

                    </div>
                    <div>
                    <table class="w-full text-center border-collapse">
                        <tbody>
                            <!-- First Row -->
                            <tr>
                                <td class="result" id="cell_lr" colspan="2">
                                    <div class="road-award-picker">
                                        <span>Longest Road: <strong id="roadHolder">None</strong></span>
                                        <button type="button" id="roadAwardButton" aria-label="Assign longest road" aria-expanded="false" aria-controls="roadChoices" onclick="toggleRoadChoices()">Assign</button>
                                        <div id="roadChoices" hidden>
                                            <button type="button" data-player-id="player1" onclick="handleDropdownChange('player1')">Player 1</button>
                                            <button type="button" data-player-id="player2" onclick="handleDropdownChange('player2')">Player 2</button>
                                            <button type="button" data-player-id="player3" onclick="handleDropdownChange('player3')">Player 3</button>
                                            <button type="button" data-player-id="player4" onclick="handleDropdownChange('player4')">Player 4</button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="right-column">
            <div class="right-section game-activity-section">
                <h2>Activity</h2>
                <div id="gameActivity" role="log" aria-live="polite"></div>
            </div>
        </div>
        
        
    </div>
    <script>window.CATAN_PLAYER_COLORS = {{ player_colors|tojson }};</script>
    <script src="{{ url_for('static', filename='js/catan_drawing_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/catan_game_logic.js') }}"></script>
</body>
</html>
