<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Display</title>
    <style>
        :root { color-scheme: dark; background: #000; color: #fff; font-family: "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        html, body, #tvApp { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
        #tvApp { position: relative; display: grid; place-items: center; }
        #playerStage { width: 100%; height: 100%; display: grid; place-items: center; }
        #tvYoutubePlayer, #tvLocalPlayer { width: 100%; height: 100%; border: 0; object-fit: contain; background: #000; }
        #tvYoutubePlayer { pointer-events: none; }
        #playerStage { cursor: none; }
        #tvYoutubePlayer[hidden], #tvLocalPlayer[hidden] { display: none; }
        #tvAudioOverlay { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 24px; padding: 32px 32px 48px; background: #101413; color: #edf2ee; text-align: center; }
        #tvAudioOverlay[hidden] { display: none; }
        #tvAudioInfo { width: min(1100px, 100%); margin: auto; max-height: 100%; overflow-y: auto; }
        #tvAudioOverlay h1 { margin: 0; font-size: 2rem; line-height: 1.25; overflow-wrap: anywhere; }
        #tvAudioArtist { margin: 12px 0 20px; color: #a7d7a5; font-size: 1.25rem; overflow-wrap: anywhere; }
        #tvAudioArtist:empty { display: none; }
        #tvAudioDetails { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; margin: 20px 0 0; }
        #tvAudioDetails .audio-detail-wide { grid-column: 1 / -1; }
        #tvAudioDetails dt { margin-bottom: 4px; color: #a7b3ab; font-size: .85rem; }
        #tvAudioDetails dd { margin: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
        #tvAudioTime { margin: 0 0 12px; color: #a7d7a5; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
        #tvAudioChapters { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; max-height: 28vh; overflow-y: auto; }
        #tvAudioChapters[hidden] { display: none; }
        .audio-chapter-label { align-self: center; color: #a7b3ab; }
        .audio-chapter-time { padding: 6px 10px; border-bottom: 2px solid #49544d; color: #edf2ee; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
        .audio-chapter-time.current { border-color: #e8c879; color: #e8c879; }
        @media (min-width: 1000px) { #tvAudioOverlay h1 { font-size: 3rem; } }
        @media (max-width: 600px) { #tvAudioOverlay { padding: 20px 16px 40px; gap: 16px; } #tvAudioOverlay h1 { font-size: 1.5rem; } #tvAudioDetails { gap: 12px; } }
        .audio-only #tvYoutubePlayer, .audio-only #tvLocalPlayer { opacity: 0; }
        #tvStatus { position: absolute; inset: auto 16px 14px; margin: 0; color: #ddd; font-size: .9rem; text-align: center; text-shadow: 0 1px 5px #000; pointer-events: none; }
    </style>
</head>
<body>
    <main id="tvApp" data-mode="tv">
        <div id="playerStage">
            <div id="tvYoutubePlayer" hidden></div>
            <video id="tvLocalPlayer" playsinline preload="metadata" hidden></video>
        </div>
        <div id="tvAudioOverlay" hidden>
            <section id="tvAudioInfo" aria-label="Current song">
                <h1 id="tvAudioTitle"></h1>
                <p id="tvAudioArtist" aria-label="Artist"></p>
                <dl id="tvAudioDetails"></dl>
            </section>
            <footer>
                <p id="tvAudioTime"></p>
                <div id="tvAudioChapters" aria-label="Chapters" hidden></div>
            </footer>
        </div>
        <p id="tvStatus" role="status">Waiting for media selection</p>
    </main>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/mm_tvremote.js') }}?v=17"></script>
</body>
</html>
