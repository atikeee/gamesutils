<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Music{% if tv_mode %} TV{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mm.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mm_mp3.css') }}?v=2">
</head>
<body class="mp3-page{% if tv_mode %} mp3-tv{% endif %}">
    <div class="mm-container" id="appContainer"
         data-tracks='{{ tracks | tojson }}'
         data-playlist-options='{{ all_playlists | tojson }}'
         data-category-options='{{ all_categories | tojson }}'
         data-artist-options='{{ all_artists | default([]) | tojson }}'
         data-selected-tags='{{ selected_tags | default([]) | tojson }}'
         data-tv-mode='{{ tv_mode | default(false) | tojson }}'>
        <div class="mp3-pinned">
        <header class="mm-header">
            <label class="mp3-filter"><span>Playlist</span>
            <select id="playlistSelect" class="playlist-select" aria-label="Playlist">
                {% for pl in all_playlists %}
                    <option value="{{ pl }}" {% if pl == selected_playlist %}selected{% endif %}>{{ pl }}</option>
                {% endfor %}
            </select>
            </label>
            <label class="mp3-filter"><span>Category</span>
            <select id="categorySelect" class="playlist-select category-select" aria-label="Category">
                <option value="" {% if not selected_category %}selected{% endif %}>All</option>
                {% for cat in all_categories %}
                    <option value="{{ cat }}" {% if cat == selected_category %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
            </label>
            <label class="mp3-filter"><span>Artist</span>
                <select id="artistSelect" class="playlist-select" aria-label="Artist" title="Filter by artist">
                    <option value="">All artists</option>
                    {% for artist in all_artists %}
                    <option value="{{ artist }}" {% if artist == selected_artist %}selected{% endif %}>{{ artist }}</option>
                    {% endfor %}
                </select>
            </label>
            <div class="tag-filter-bar" id="tagChipsBar" role="group" aria-label="Filter by tag"></div>
        </header>

            <section class="mp3-player" aria-label="Audio player">
                <div class="mp3-now-playing">
                    <h1 id="nowTitle">Select a track</h1>
                    <p id="nowArtist"></p>
                </div>
                <div class="player-controls-bar">
                    <div class="timeline-row">
                        <span class="time-label" id="currTime">0:00</span>
                        <input type="range" id="scrubber" class="range-slider timeline-slider" value="0" min="0" max="100" step="0.1" aria-label="Seek" tabindex="-1">
                        <span class="time-label" id="durTime">0:00</span>
                    </div>

                    <div class="buttons-row">
                        <button class="ctrl-btn page-nav-btn" id="queuePrevBtn" type="button" title="Previous page" aria-label="Previous page">
                            <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/file-output.svg" alt="" aria-hidden="true" width="24" height="24">
                        </button>
                        <button class="ctrl-btn" id="prevTrackBtn" type="button" title="Previous" aria-label="Previous track">&#9198;</button>
                        <button class="ctrl-btn chapter-btn" id="prevChapterBtn" type="button" title="Previous chapter" aria-label="Previous chapter" disabled>&#10094;|</button>
                        <button class="ctrl-btn" id="rev30sBtn" type="button" title="Back 30 s" aria-label="Back 30 seconds">&#8634;</button>
                        <button class="ctrl-btn play-main-btn" id="mainPlayBtn" type="button" title="Play / Pause" aria-label="Play or pause">
                            <span class="icon-play">&#9658;</span>
                            <span class="icon-pause">&#10074;&#10074;</span>
                        </button>
                        <button class="ctrl-btn" id="fwd30sBtn" type="button" title="Forward 30 s" aria-label="Forward 30 seconds">&#8635;</button>
                        <button class="ctrl-btn chapter-btn" id="nextChapterBtn" type="button" title="Next chapter" aria-label="Next chapter" disabled>|&#10095;</button>
                        <button class="ctrl-btn" id="nextTrackBtn" type="button" title="Next" aria-label="Next track">&#9197;</button>
                        <button class="ctrl-btn page-nav-btn page-next-btn" id="queueNextBtn" type="button" title="Next page" aria-label="Next page">
                            <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/file-output.svg" alt="" aria-hidden="true" width="24" height="24">
                        </button>
                    </div>

                </div>
            </section>
        </div>

        <main class="mp3-scroll" id="libraryScroll" aria-label="Track details and song list">
                    {% if not tv_mode %}
                    <section class="active-video-meta" aria-label="Edit current track">
                        <div class="meta-managers-group">
                            <!-- Playlist / Category: click the value to edit or pick -->
                            <div class="meta-fields-row">
                                  <div class="mp3-edit-field">
                                  <span class="inline-edit" id="playlistEdit" data-field="playlist" aria-label="Edit playlist"
                                      data-value="" tabindex="-1" role="button"
                                      title="Playlist — click to change"></span>
                                  </div>
                                  <div class="mp3-edit-field">
                                  <span class="inline-edit empty" id="categoryEdit" data-field="category" aria-label="Edit category"
                                      data-value="" tabindex="-1" role="button"
                                      title="Category — click to change">+ category</span>
                                  </div>
                                  <div class="mp3-edit-field">
                                      <span class="inline-edit empty" id="artistEdit" data-field="artist" aria-label="Edit artist"
                                            data-value="" tabindex="-1" role="button" title="Artist — click to change">+ artist</span>
                                  </div>
                            </div>

                            <div class="video-tag-manager">
                                <div class="video-tags-list" id="activeTagList"></div>
                                <div class="add-tag-inline">
                                    <input type="text" id="inlineTagInput" list="trackTagsDatalist" placeholder="Add tag..." autocomplete="off" tabindex="-1">
                                    <datalist id="trackTagsDatalist"></datalist>
                                    <button type="button" id="addInlineTagBtn" tabindex="-1">+</button>
                                </div>
                            </div>
                            <form class="chapter-editor" id="chapterForm">
                                <label class="meta-label" for="chapterInput">Chapters</label>
                                <input id="chapterInput" name="chapter" type="text" placeholder="10, 1:05, 1:5:10" autocomplete="off" maxlength="4096" disabled tabindex="-1">
                                <button class="icon-btn" type="submit" id="saveChaptersBtn" title="Save chapters" aria-label="Save chapters" disabled tabindex="-1">&#10003;</button>
                                <output id="chapterStatus" aria-live="polite"></output>
                            </form>
                        </div>
                    </section>
                        {% endif %}

            <section class="playlist-column" aria-label="Songs">
                <div class="playlist-header">
                    <h3>Up Next (<span id="totalQueueCount">{{ tracks|length }}</span>)</h3>
                    <span class="page-indicator">Page <span id="curQueuePage">1</span> of <span id="maxQueuePage">1</span></span>
                </div>

                <div class="playlist-items-list" id="queueList" role="listbox" aria-label="Songs" tabindex="-1"></div>

                <div class="numbered-pagination-bar">
                    <div class="pagination-scroll-track" id="pageScrollTrack"></div>
                </div>
            </section>
        </main>
    </div>

    <audio id="audioEngine"></audio>

    <script src="{{ url_for('static', filename='js/mm_common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mm_mp3.js') }}?v=2"></script>
</body>
</html>
